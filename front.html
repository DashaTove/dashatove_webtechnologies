<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Front End</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffd6ec;
            color: #333;
        }

        /* Navbar */
        .navbar {
            background-color: #9b5c8f;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Main content */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 20px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 20px;
            color: #6c757d;
            margin-bottom: 60px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            background-color: #9b5c8f;
            color: #ffffff;
        }

        .btn:hover {
            background-color: #7f4a75;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">WEB-T by Shegidevich Darya</a>
        <a href="web_t.html">Home</a>
    </div>

    <div class="container">
        <h1>WEB-T Front</h1>

        <div class="buttons">
            <a href="project_1.html"><button class="btn">Project 1: Bootstrap</button></a>
            <a href="project_2.html"><button class="btn">Project 2: CSS Grid</button></a>
        </div>
    </div>

</body>
</html>
