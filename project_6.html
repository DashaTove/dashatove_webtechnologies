<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Changing colors</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffd6ec;
            color: #333;
        }

        /* Navbar */
        .navbar {
            background-color: #9b5c8f;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Main content */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 140px 20px;
            text-align: center;
        }

        h1 {
            font-size: 46px;
            margin-bottom: 50px;
            color: #9b5c8f;

        }

        .pick-text {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 50px;
            transition: color 0.3s ease;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .btn {
            padding: 15px 45px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #9b5c8f;
            color: #ffffff;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">WEB-T by Shegidevich Darya</a>
        <a href="web_t.html">Home</a>
    </div>

    <div class="container">
        <h1>Changing colors</h1>

        <div id="pickText" class="pick-text">
            Pick a color
        </div>

        <div class="buttons">
            <button class="btn" onclick="changeColor('red')">Red</button>
            <button class="btn" onclick="changeColor('blue')">Blue</button>
            <button class="btn" onclick="changeColor('green')">Green</button>
        </div>
    </div>

    <script>
        function changeColor(color) {
            document.getElementById('pickText').style.color = color;
        }
    </script>

</body>
</html>
