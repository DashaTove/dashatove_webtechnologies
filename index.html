    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #eef0ff;
            color: #1c1c3a;
        }

        /* Header */
        .header {
            background-color: #6f7a9c;
            text-align: center;
            padding: 40px 20px;
        }

        .avatar {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 4px solid #1c1c3a;
        }

        .header_title {
            margin: 10px 0 0;
            font-size: 28px;
            font-weight: 700;
        }

        .header_subtitle {
            margin: 5px 0;
            font-size: 22px;
            font-weight: 500;
                        font-weight: bold;
        }

        .header_topic {
            margin: 15px auto 25px;
            max-width: 900px;
            font-size: 18px;
            font-weight: 500;
            color: #ffffff;
        }

        .web_t {
            padding: 10px 30px;
            font-size: 16px;
            background-color: #0b0d3d;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Separator */
        .separator {
            border: none;
            height: 2px;
            background-color: #0b0d3d;
            margin: 40px auto;
            width: 90%;
        }

        /* Navigation buttons */
        .interaction {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }

        .interaction button {
            padding: 12px;
            font-size: 15px;
            background-color: #0b0d3d;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .interaction button:hover {
            background-color: #1a1f6b;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0;
        }

        .contacts_link {
            color: #0b0d3d;
            font-size: 18px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
